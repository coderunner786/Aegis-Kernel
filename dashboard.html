<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS Defense | SOC Lineage Console</title>
    <script type="text/javascript" src="/vis-network.min.js"></script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-safe: #238636;
            --accent-warn: #d29922;
            --accent-danger: #da3633;
            --accent-cyan: #58a6ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: var(--bg-card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-title { font-size: 1.25rem; font-weight: 700; color: #ffffff; }
        .badge-live { background-color: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid #238636; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .badge-live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background-color: #3fb950; box-shadow: 0 0 6px #3fb950; }
        .metrics-bar { display: flex; gap: 20px; }
        .metric-item { display: flex; flex-direction: column; align-items: flex-end; }
        .metric-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .metric-val { font-size: 0.95rem; font-weight: 700; }
        .workspace { display: grid; grid-template-columns: 1fr 380px; flex: 1; min-height: 0; overflow: hidden; }
        .graph-panel { position: relative; background-color: #0b0e14; border-right: 1px solid var(--border); width: 100%; height: 100%; min-height: 0; }
        #process-network { width: 100%; height: 100%; }
        .graph-overlay-legend { position: absolute; bottom: 20px; left: 20px; background: rgba(22, 27, 34, 0.9); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; display: flex; gap: 16px; font-size: 0.8rem; backdrop-filter: blur(4px); z-index: 10; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
        .canvas-hint { position: absolute; top: 20px; left: 20px; font-size: 0.75rem; color: var(--text-muted); background: rgba(22, 27, 34, 0.6); padding: 4px 8px; border-radius: 4px; pointer-events: none; }
        .sidebar { background-color: var(--bg-card); display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); display: flex; justify-content: space-between; }
        .alert-feed { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .alert-card { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 12px; cursor: pointer; transition: 0.15s; }
        .alert-card:hover { border-color: var(--accent-cyan); transform: translateX(-2px); }
        .alert-card.critical { border-left: 4px solid var(--accent-danger); }
        .alert-card.warning { border-left: 4px solid var(--accent-warn); }
        .alert-card.safe { border-left: 4px solid var(--accent-safe); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .proc-name { font-weight: 700; font-size: 0.85rem; color: #ffffff; }
        .risk-badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .badge-danger { background: rgba(218, 54, 51, 0.2); color: #f85149; }
        .badge-warn { background: rgba(210, 153, 34, 0.2); color: #e3b341; }
        .badge-safe { background: rgba(35, 134, 54, 0.2); color: #3fb950; }
        .card-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
        .cmd-preview { background: #161b22; padding: 6px 8px; border-radius: 4px; font-size: 0.72rem; font-family: monospace; color: #79c0ff; word-break: break-all; max-height: 48px; overflow: hidden; }
        .card-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-kill { background: var(--accent-danger); color: #ffffff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
        .btn-ignore { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; font-size: 0.72rem; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <span class="brand-title">🛡️ AEGIS HARDENED RUNTIME</span>
            <div class="badge-live">LIVE TELEMETRY</div>
        </div>
        <div class="metrics-bar">
            <div class="metric-item">
                <span class="metric-label">Model Latency</span>
                <span class="metric-val" style="color: var(--accent-cyan);">0.38 ms</span>
            </div>
            <div class="metric-item">
                <span class="metric-label">Active Nodes</span>
                <span class="metric-val" id="node-count">0</span>
            </div>
            <div class="metric-item">
                <span class="metric-label">Threats Mitigated</span>
                <span class="metric-val" style="color: #f85149;" id="threat-count">0</span>
            </div>
        </div>
    </header>

    <div class="workspace">
        <div class="graph-panel">
            <div class="canvas-hint">💡 Click & Drag to Pan | Scroll to Zoom</div>
            <div id="process-network"></div>
            <div class="graph-overlay-legend">
                <div class="legend-item"><div class="legend-dot" style="background:#238636;"></div> Safe (&lt;40%)</div>
                <div class="legend-item"><div class="legend-dot" style="background:#d29922;"></div> Suspicious (40-75%)</div>
                <div class="legend-item"><div class="legend-dot" style="background:#da3633;"></div> Threat (&gt;75%)</div>
            </div>
        </div>
        <div class="sidebar">
            <div class="panel-header">
                <span>Real-Time Anomaly Stream</span>
                <span id="event-counter">0 events</span>
            </div>
            <div class="alert-feed" id="alert-container"></div>
        </div>
    </div>

    <script>
        const nodes = new vis.DataSet([]);
        const edges = new vis.DataSet([]);
        const container = document.getElementById('process-network');
        const data = { nodes: nodes, edges: edges };
        
        const options = {
            autoResize: true,
            interaction: {
                dragNodes: true,
                dragView: true,
                zoomView: true,
                hover: true
            },
            layout: {
                improvedLayout: true,
                hierarchical: {
                    enabled: true,
                    direction: 'UD',
                    sortMethod: 'directed',
                    nodeSpacing: 220,
                    levelSeparation: 130
                }
            },
            nodes: {
                shape: 'box',
                margin: 12,
                font: { color: '#ffffff', face: 'monospace', size: 13, bold: true },
                borderWidth: 2,
                shadow: { enabled: true, color: 'rgba(0,0,0,0.6)', size: 8 }
            },
            edges: {
                color: { color: '#30363d', highlight: '#58a6ff' },
                arrows: { to: { enabled: true, scaleFactor: 0.8 } },
                smooth: { type: 'cubicBezier', forceDirection: 'vertical' }
            },
            physics: false
        };

        const network = new vis.Network(container, data, options);

        let threatCount = 0;
        let eventCount = 0;

        function getNodeColor(score) {
            if (score >= 75) return { background: '#8b1c1c', border: '#da3633', highlight: { background: '#da3633', border: '#ff7b72' } };
            if (score >= 40) return { background: '#694300', border: '#d29922', highlight: { background: '#d29922', border: '#e3b341' } };
            return { background: '#134e23', border: '#238636', highlight: { background: '#238636', border: '#3fb950' } };
        }

        function ingestProcessEvent(event) {
            eventCount++;
            document.getElementById('event-counter').innerText = `${eventCount} events`;

            nodes.update({
                id: event.pid,
                label: `${event.app}\n[PID: ${event.pid}]\n${event.score.toFixed(1)}% Risk`,
                color: getNodeColor(event.score)
            });

            if (event.parent_pid && nodes.get(event.parent_pid)) {
                const edgeId = `${event.parent_pid}->${event.pid}`;
                if (!edges.get(edgeId)) edges.add({ id: edgeId, from: event.parent_pid, to: event.pid });
            }

            document.getElementById('node-count').innerText = nodes.length;
            renderAlertCard(event);

            // Auto-fit network in canvas smoothly
            network.fit({ animation: { duration: 300, easingFunction: 'easeInOutQuad' } });

            if (event.score >= 75) {
                threatCount++;
                document.getElementById('threat-count').innerText = threatCount;
            }
        }

        function renderAlertCard(event) {
            const feed = document.getElementById('alert-container');
            const card = document.createElement('div');
            
            let severity = event.score >= 75 ? 'critical' : (event.score >= 40 ? 'warning' : 'safe');
            let badgeClass = event.score >= 75 ? 'badge-danger' : (event.score >= 40 ? 'badge-warn' : 'badge-safe');

            card.className = `alert-card ${severity}`;
            card.id = `card-${event.pid}`;
            card.innerHTML = `
                <div class="card-header">
                    <span class="proc-name">${event.app}</span>
                    <span class="risk-badge ${badgeClass}">${event.score.toFixed(1)}%</span>
                </div>
                <div class="card-meta">PID: <b>${event.pid}</b> | Parent: <b>${event.parent_pid || 'None'}</b></div>
                <div class="cmd-preview" title="${event.cmd}">${event.cmd || 'N/A'}</div>
                ${event.score >= 75 ? `
                    <div class="card-actions">
                        <button class="btn-kill" onclick="terminateProcess(${event.pid})">🛑 Terminate</button>
                        <button class="btn-ignore" onclick="dismissAlert(${event.pid})">Ignore</button>
                    </div>
                ` : ''}
            `;
            
            card.onclick = (e) => {
                if (e.target.tagName !== 'BUTTON') {
                    network.focus(event.pid, { scale: 1.2, animation: true });
                    network.selectNodes([event.pid]);
                }
            };

            feed.prepend(card);
        }

        function terminateProcess(pid) {
            fetch(`/kill?pid=${pid}`)
                .then(r => r.json())
                .then(res => {
                    const card = document.getElementById(`card-${pid}`);
                    if (card) {
                        card.style.opacity = '0.4';
                        card.querySelector('.card-actions').innerHTML = '<span style="color:#f85149; font-size:0.75rem; font-weight:bold;">[TERMINATED]</span>';
                    }
                    nodes.update({ id: pid, color: { background: '#21262d', border: '#484f58' } });
                });
        }

        function dismissAlert(pid) {
            const card = document.getElementById(`card-${pid}`);
            if (card) card.remove();
        }

        const eventSource = new EventSource('/events');
        eventSource.onmessage = function(e) {
            const data = JSON.parse(e.data);
            ingestProcessEvent(data);
        };
    </script>
</body>
</html>
